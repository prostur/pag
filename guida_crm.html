<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM &amp; Vendite nel Turismo — Guida Visiva Interattiva</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fbfaf7;
  --card: #ffffff;
  --ink: #1d2433;
  --mut: #5d6679;
  --line: #e6e3da;
  --c1: #3b6df0;
  --c2: #12a37f;
  --c3: #f08a1c;
  --c4: #e0457b;
  --c5: #8a4fe0;
  --c6: #0fa5c4;
  --c7: #d9a400;
  --c8: #e5533d;
  --c9: #4f9d2d;
  --a: var(--c1);
  --at: #e9effe;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
}
h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  line-height: 1.18;
  margin: 0 0 .5em;
}
.app {
  display: grid;
  grid-template-columns: 270px 1fr;
  min-height: 100vh;
}
nav {
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow-y: auto;
  padding: 22px 14px;
  border-right: 1px solid var(--line);
  background: #fff;
  z-index: 20;
}
nav .brand {
  font: 800 18px 'Bricolage Grotesque', sans-serif;
  padding: 0 10px 6px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
nav .brand-sub {
  font-size: 12px;
  color: var(--mut);
  padding: 0 10px 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
nav a {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 11px;
  color: var(--ink);
  text-decoration: none;
  font-weight: 500;
  font-size: 14.5px;
  cursor: pointer;
  margin-bottom: 3px;
  transition: background .15s, transform .1s;
}
nav a i {
  width: 11px;
  height: 11px;
  border-radius: 4px;
  background: var(--c);
  flex: none;
}
nav a:hover { background: #f3f1ea; }
nav a.on {
  background: color-mix(in srgb, var(--c) 14%, #fff);
  font-weight: 700;
  color: color-mix(in srgb, var(--c) 82%, #000);
}
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--a);
  outline-offset: 2px;
}
main {
  padding: 36px min(5vw, 52px) 90px;
  max-width: 1040px;
  width: 100%;
}
.lead {
  font-size: 18px;
  color: var(--mut);
  max-width: 66ch;
  margin-bottom: 24px;
}
h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; }
h2 { font-size: clamp(23px, 3.2vw, 31px); font-weight: 800; }
h3 { font-size: 20px; font-weight: 700; }
.tag {
  display: inline-block;
  background: var(--at);
  color: color-mix(in srgb, var(--a) 85%, #000);
  border-radius: 99px;
  padding: 4px 13px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: .01em;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(29,36,51,.03);
}
.grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
  margin: 18px 0;
}
.grid-2 {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  margin: 18px 0;
}
.tile {
  border: 0;
  text-align: left;
  font: inherit;
  cursor: pointer;
  color: var(--ink);
  border-radius: 16px;
  padding: 18px;
  background: color-mix(in srgb, var(--c) 11%, #fff);
  border-left: 6px solid var(--c);
  transition: transform .15s, box-shadow .15s;
}
.tile:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(29,36,51,.07);
}
.tile b {
  display: block;
  font: 700 17.5px 'Bricolage Grotesque', sans-serif;
  margin-bottom: 5px;
}
.tile span { color: var(--mut); font-size: 14px; line-height: 1.45; display: block; }

/* Schemi e Box Visivi */
.schema-box {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  margin: 22px 0;
}
.schema-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.schema-title {
  font: 700 17px 'Bricolage Grotesque', sans-serif;
  color: var(--ink);
}
.schema-sub {
  font-size: 13.5px;
  color: var(--mut);
  margin: 0 0 14px;
}
.svg-wrap {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #fcfbf9;
  border: 1px solid #efede6;
  padding: 10px;
}
.svg-wrap svg {
  display: block;
  width: 100%;
  height: auto;
}

/* Concetto Card */
.concept {
  background: #fff;
  border: 1px solid var(--line);
  border-left: 5px solid var(--c, var(--a));
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 14px;
}
.concept-hdr {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.concept-title {
  font: 800 18.5px 'Bricolage Grotesque', sans-serif;
  color: var(--ink);
}
.concept-it {
  font-size: 13px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--c, var(--a)) 14%, #fff);
  color: color-mix(in srgb, var(--c, var(--a)) 85%, #000);
}
.concept p { margin: 0 0 10px; color: var(--ink); font-size: 15.5px; }
.ex-box {
  background: #f7f6f1;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  color: #364054;
}
.ex-box strong { color: var(--ink); }

/* Tabs */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}
.tabs button {
  border: 2px solid var(--c);
  background: #fff;
  color: var(--ink);
  padding: 8px 16px;
  border-radius: 99px;
  font: 600 14px 'Figtree', sans-serif;
  cursor: pointer;
  transition: all .15s;
}
.tabs button[aria-selected="true"] {
  background: var(--c);
  color: #fff;
}
.panel {
  border-radius: 18px;
  padding: 22px;
  background: color-mix(in srgb, var(--c) 8%, #fff);
  border: 1px solid color-mix(in srgb, var(--c) 30%, #fff);
}

/* Pulsanti e Controlli */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: var(--a);
  color: #fff;
  padding: 10px 18px;
  border-radius: 11px;
  font: 600 14.5px 'Figtree', sans-serif;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .92; }
.btn:active { transform: scale(.98); }
.btn-sec {
  background: #f1efe8;
  color: var(--ink);
}
.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 8px;
}

/* Simulatore & Slider */
.sim-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  background: #fcfbf9;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 10px;
}
.sim-row label {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-weight: 500;
  flex: 1;
}
.sim-row input[type="checkbox"] {
  width: 19px;
  height: 19px;
  accent-color: var(--c3);
  cursor: pointer;
}
.bar-track {
  height: 14px;
  background: #ece9e0;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .35s ease;
}
.slider-group { margin-bottom: 16px; }
.slider-hdr { display: flex; justify-content: space-between; font-weight: 600; font-size: 14.5px; margin-bottom: 6px; }
input[type="range"] {
  width: 100%;
  accent-color: var(--c4);
  cursor: pointer;
}

/* Checklist */
.chk-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 10px;
  background: #fff;
  cursor: pointer;
  transition: background .15s;
}
.chk-item.done {
  background: color-mix(in srgb, var(--c6) 9%, #fff);
  border-color: color-mix(in srgb, var(--c6) 40%, #fff);
}
.chk-item input {
  margin-top: 3px;
  width: 18px;
  height: 18px;
  accent-color: var(--c6);
}

/* Flashcard & Quiz */
.flashcard {
  background: #fff;
  border: 2px solid var(--c9);
  border-radius: 20px;
  padding: 32px 24px;
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(79,157,45,.08);
  transition: transform .2s;
  user-select: none;
}
.flashcard:hover { transform: translateY(-2px); }
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  margin-bottom: 10px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font: 500 15px 'Figtree', sans-serif;
  cursor: pointer;
  transition: all .15s;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--c9); background: #f6fbf3; }
.quiz-opt.ok { border-color: #12a37f; background: #e6f7f2; font-weight: 700; }
.quiz-opt.ko { border-color: #e5533d; background: #fdecea; }

.search-input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font: 15px 'Figtree', sans-serif;
  background: #fff;
  margin-bottom: 14px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 500;
  z-index: 100;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

.nav-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 34px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

@media (max-width: 800px) {
  .app { display: block; }
  nav {
    position: sticky;
    top: 0;
    height: auto;
    max-height: none;
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 12px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    background: #fff;
    -webkit-overflow-scrolling: touch;
  }
  nav .brand, nav .brand-sub { display: none; }
  nav a { white-space: nowrap; padding: 8px 12px; margin-bottom: 0; font-size: 14px; }
  main { padding: 24px 16px 80px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Menu delle sezioni"></nav>
  <main id="v" tabindex="-1"></main>
</div>

<script>

/* ==========================================================================
   HELPER DI RENDERING CONCETTI E SCHEMI
   ========================================================================== */
function renderConceptCard(id) {
  const c = CONCEPTS.find(x => x.id === id);
  if (!c) return '';
  return `
    <article class="concept" style="--c:var(${c.color})">
      <div class="concept-hdr">
        <span class="concept-title">${c.en}</span>
        <span class="concept-it">${c.it}</span>
      </div>
      <p>${c.def}</p>
      <div class="ex-box"><strong>Esempio nel turismo:</strong> ${c.ex}</div>
    </article>
  `;
}

function renderFooterNav(prevId, nextId) {
  const prev = SECTIONS.find(s => s.id === prevId);
  const next = SECTIONS.find(s => s.id === nextId);
  return `
    <div class="nav-footer">
      ${prev ? `<button class="btn btn-sec" data-go="${prev.id}">← ${prev.t}</button>` : '<span></span>'}
      ${next ? `<button class="btn" data-go="${next.id}">Avanti: ${next.t} →</button>` : ''}
    </div>
  `;
}

/* ==========================================================================
   MOTORE DI NAVIGAZIONE E RENDERING (iFrame & Google Sites Safe)
   ========================================================================== */
function navigateTo(id) {
  if (!V[id]) id = 'panoramica';
  state.view = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  render(false);
}

function render(keepScroll = true) {
  const sec = SECTIONS.find(x => x.id === state.view) || SECTIONS[0];
  document.documentElement.style.setProperty('--a', `var(${sec.c})`);
  document.documentElement.style.setProperty('--at', `color-mix(in srgb, var(${sec.c}) 14%, #fff)`);

  $('#nav').innerHTML = `
    <div class="brand">🧭 Guida CRM Turismo</div>
    <div class="brand-sub">26 concetti con schemi visivi</div>
  ` + SECTIONS.map(item => `
    <a data-go="${item.id}" style="--c:var(${item.c})" class="${item.id === state.view ? 'on' : ''}" ${item.id === state.view ? 'aria-current="page"' : ''}>
      <i></i>${item.t}
    </a>
  `).join('');

  const vEl = $('#v');
  vEl.innerHTML = V[state.view] ? V[state.view]() : '';

  if (!keepScroll) {
    window.scrollTo(0, 0);
    if (vEl) vEl.scrollTop = 0;
  }
}

/* ==========================================================================
   DELEGAZIONE EVENTI UNIVERSALE
   ========================================================================== */
document.addEventListener('click', e => {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) {
    e.preventDefault();
    navigateTo(goBtn.dataset.go);
    return;
  }

  const crmTab = e.target.closest('[data-crmtab]');
  if (crmTab) {
    state.crmTab = crmTab.dataset.crmtab;
    render(true);
    return;
  }

  const segBtn = e.target.closest('[data-seg]');
  if (segBtn) {
    state.segSelected = segBtn.dataset.seg;
    render(true);
    return;
  }

  const pmodeBtn = e.target.closest('[data-pmode]');
  if (pmodeBtn) {
    state.practiceMode = pmodeBtn.dataset.pmode;
    render(true);
    return;
  }

  const catBtn = e.target.closest('[data-cat]');
  if (catBtn) {
    state.catFilter = catBtn.dataset.cat;
    render(true);
    return;
  }

  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const c = CONCEPTS.find(x => x.id === copyBtn.dataset.copy);
    if (c) copyText(`${c.en}: ${c.def}`);
    return;
  }

  if (e.target.closest('#fcCard') || e.target.closest('#fcFlipBtn')) {
    state.fcFlipped = !state.fcFlipped;
    render(true);
    return;
  }

  const fcNav = e.target.closest('[data-fcnav]');
  if (fcNav) {
    const dir = parseInt(fcNav.dataset.fcnav, 10);
    state.fcIndex = (state.fcIndex + dir + CONCEPTS.length) % CONCEPTS.length;
    state.fcFlipped = false;
    render(true);
    return;
  }

  const qAns = e.target.closest('[data-qans]');
  if (qAns && state.quizAnswered === null) {
    const chosen = parseInt(qAns.dataset.qans, 10);
    state.quizAnswered = chosen;
    if (chosen === QUIZ_QUESTIONS[state.quizIndex].ans) state.quizScore++;
    render(true);
    return;
  }

  if (e.target.closest('[data-qnext]')) {
    state.quizIndex++;
    state.quizAnswered = null;
    render(true);
    return;
  }

  if (e.target.closest('[data-qreset]')) {
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = null;
    render(true);
    return;
  }
});

document.addEventListener('change', e => {
  const dealChk = e.target.closest('[data-deal]');
  if (dealChk) {
    const idx = parseInt(dealChk.dataset.deal, 10);
    state.deals[idx].on = dealChk.checked;
    render(true);
    return;
  }

  const gdprChk = e.target.closest('[data-chk]');
  if (gdprChk) {
    const idx = parseInt(gdprChk.dataset.chk, 10);
    state.gdprChecks[idx] = gdprChk.checked;
    render(true);
    return;
  }
});

document.addEventListener('input', e => {
  const clvSlider = e.target.closest('[data-clv]');
  if (clvSlider) {
    const kind = clvSlider.dataset.clv;
    const val = parseFloat(clvSlider.value);
    if (kind === 'spend') state.clvSpend = val;
    if (kind === 'trips') state.clvTrips = val;
    if (kind === 'years') state.clvYears = val;
    render(true);
    return;
  }

  if (e.target.id === 'glossSearch') {
    const pos = e.target.selectionStart;
    state.search = e.target.value;
    render(true);
    const inp = $('#glossSearch');
    if (inp) {
      inp.focus();
      try { inp.setSelectionRange(pos, pos); } catch (err) {}
    }
  }
});

/* ==========================================================================
   CLIPBOARD CON FALLBACK SANDBOX
   ========================================================================== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(() => toast('Definizione copiata!'), () => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(txt) {
  try {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Definizione copiata!');
  } catch (e) {
    toast('Impossibile copiare automaticamente');
  }
}

window.addEventListener('load', () => {
  const h = location.hash.replace('#', '');
  if (h && V[h]) state.view = h;
  render(false);
});
</script>
