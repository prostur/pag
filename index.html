<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11130f">
  <meta name="description" content="Qualcosa di nuovo sta arrivando. Stiamo preparando il prossimo capitolo.">
  <title>Presto online — Un nuovo inizio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11130f;
      --paper: #e9e6dc;
      --muted: #aaa99d;
      --accent: #d6f078;
      --line: rgba(233,230,220,.17);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      background: var(--bg); color: var(--paper);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      z-index: 5;
    }
    .shell { min-height: 100vh; display: flex; flex-direction: column; padding: 34px 5.5vw 26px; position: relative; isolation: isolate; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; letter-spacing: .19em; text-transform: uppercase; font-weight: 600; }
    .brand-mark { width: 25px; height: 25px; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-family: Georgia, serif; font-size: 15px; }
    .top-note, footer { color: var(--muted); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .top-note { display: flex; align-items: center; gap: 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(214,240,120,.7); animation: pulse 2.2s infinite; }
    main { flex: 1; display: grid; place-items: center; padding: 70px 0 90px; }
    .hero { width: min(100%, 1050px); position: relative; }
    .eyebrow { color: var(--accent); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; margin: 0 0 30px 7px; display: flex; align-items: center; gap: 13px; }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: var(--accent); }
    h1 { margin: 0; max-width: 900px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(64px, 11.5vw, 156px); line-height: .88; letter-spacing: -.075em; font-weight: 400; position: relative; z-index: 2; }
    h1 .second { display: block; color: transparent; -webkit-text-stroke: 1px rgba(233,230,220,.75); font-style: italic; padding-left: clamp(25px, 12vw, 170px); }
    .hero-bottom { margin: 58px 0 0 auto; width: min(100%, 470px); display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; position: relative; z-index: 2; }
    .description { color: var(--muted); font-size: 14px; line-height: 1.8; max-width: 330px; margin: 0; }
    .description strong { color: var(--paper); font-weight: 500; }
    .arrow { width: 54px; height: 54px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 21px; transition: transform .3s, background .3s; }
    .hero:hover .arrow { transform: rotate(45deg); background: rgba(214,240,120,.07); }
    .orb { position: absolute; width: clamp(210px, 35vw, 470px); aspect-ratio: 1; border: 1px solid rgba(214,240,120,.19); border-radius: 50%; right: 2%; top: 50%; transform: translateY(-54%); z-index: 0; }
    .orb::before, .orb::after { content: ""; position: absolute; border: 1px solid rgba(233,230,220,.1); border-radius: 50%; inset: 11%; }
    .orb::after { inset: 24%; border-color: rgba(214,240,120,.15); }
    .orb-core { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); top: 15%; left: 22%; box-shadow: 0 0 25px 5px rgba(214,240,120,.22); }
    .orbit { position: absolute; inset: -9%; border: 1px solid transparent; border-top-color: rgba(214,240,120,.28); border-radius: 50%; animation: spin 22s linear infinite; }
    footer { border-top: 1px solid var(--line); padding-top: 19px; }
    .footer-right { display: flex; gap: 26px; align-items: center; }
    .footer-right span:last-child { color: var(--paper); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .45; box-shadow: 0 0 3px rgba(214,240,120,.3); } }
    @media (max-width: 650px) {
      .shell { padding: 24px 22px 20px; }
      .top-note { font-size: 8px; letter-spacing: .1em; }
      main { padding: 90px 0 100px; }
      .eyebrow { margin-bottom: 26px; }
      h1 { font-size: clamp(60px, 17vw, 100px); }
      h1 .second { padding-left: 7vw; }
      .orb { width: 65vw; right: -10%; top: 42%; opacity: .7; }
      .hero-bottom { margin-top: 55px; grid-template-columns: 1fr auto; gap: 15px; }
      .description { font-size: 13px; max-width: 260px; }
      .arrow { width: 44px; height: 44px; }
      footer { font-size: 8px; letter-spacing: .1em; }
      .footer-right { gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark">P</span><span>Un nuovo progetto</span></div>
      <div class="top-note"><span class="dot" aria-hidden="true"></span> Stiamo preparando qualcosa</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="headline">
        <div class="orb" aria-hidden="true"><span class="orb-core"></span><span class="orbit"></span></div>
        <p class="eyebrow">Un nuovo inizio · 2026</p>
        <h1 id="headline">Qualcosa<br><span class="second">sta arrivando.</span></h1>
        <div class="hero-bottom">
          <p class="description">Le idee migliori hanno bisogno di tempo. Stiamo lavorando a qualcosa di speciale. <strong>Ci vediamo presto.</strong></p>
          <div class="arrow" aria-hidden="true">↗</div>
        </div>
      </section>
    </main>

    <footer>
      <span>© <span id="year">2026</span> · Tutti i diritti riservati</span>
      <div class="footer-right"><span>Made with intention</span><span>Coming soon</span></div>
    </footer>
  </div>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
